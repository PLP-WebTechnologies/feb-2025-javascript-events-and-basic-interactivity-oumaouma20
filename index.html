<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Event Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>JavaScript Event Playground</h1>
        <p>Try all the interactive elements below!</p>
    </header>

    <main>
        <!-- 1. Event Handling Section -->
        <section class="event-section">
            <h2>Event Handling</h2>
            
            <div class="event-box">
                <button id="click-btn" class="event-btn">Click Me!</button>
                <p id="click-output">Button not clicked yet</p>
            </div>
            
            <div class="event-box hover-box">
                <p id="hover-output">Hover over this box!</p>
            </div>
            
            <div class="event-box">
                <input type="text" id="keypress-input" placeholder="Type something...">
                <p id="keypress-output">Start typing to see events</p>
            </div>
            
            <div class="event-box">
                <button id="secret-btn" class="event-btn">Find the Secret!</button>
                <p id="secret-output">🤫</p>
            </div>
        </section>

        <!-- 2. Interactive Elements Section -->
        <section class="interactive-section">
            <h2>Interactive Elements</h2>
            
            <div class="color-changer">
                <button id="color-btn">Change My Color</button>
            </div>
            
            <div class="gallery">
                <div class="gallery-controls">
                    <button id="prev-btn">←</button>
                    <span id="image-counter">1/3</span>
                    <button id="next-btn">→</button>
                </div>
                <div class="gallery-images">
                    <img src="https://picsum.photos/id/237/400/300" alt="Gallery image 1" class="active">
                    <img src="https://picsum.photos/id/238/400/300" alt="Gallery image 2">
                    <img src="https://picsum.photos/id/239/400/300" alt="Gallery image 3">
                </div>
            </div>
            
            <div class="tabs">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="tab1">Tab 1</button>
                    <button class="tab-btn" data-tab="tab2">Tab 2</button>
                    <button class="tab-btn" data-tab="tab3">Tab 3</button>
                </div>
                <div class="tab-content">
                    <div id="tab1" class="tab-pane active">
                        <p>Content for Tab 1</p>
                    </div>
                    <div id="tab2" class="tab-pane">
                        <p>Content for Tab 2</p>
                    </div>
                    <div id="tab3" class="tab-pane">
                        <p>Content for Tab 3</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. Form Validation Section -->
        <section class="form-section">
            <h2>Form Validation</h2>
            <form id="validation-form">
                <div class="form-group">
                    <label for="name">Name (Required)</label>
                    <input type="text" id="name" required>
                    <span class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                    <span class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">Password (Min 8 chars)</label>
                    <input type="password" id="password">
                    <span class="error-message"></span>
                    <div class="password-strength">
                        <span class="strength-bar"></span>
                    </div>
                </div>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
